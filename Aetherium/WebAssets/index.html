<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script src="marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: #1d1d1f;
    -webkit-text-size-adjust: 100%;
  }
  body.dark { color: #f5f5f7; }

  #conversation { padding: 10px 16px 14px; }

  /* ===== 吹き出しレイアウト ===== */
  .msg { display: flex; flex-direction: column; padding: 8px 0; }
  .msg.assistant { align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  /* アバター＋本文の行。アバターは吹き出しの下端に揃える（統計・ソースには引っ張られない）。 */
  .row { display: flex; align-items: flex-end; gap: 10px; max-width: 100%; }
  .msg.user .row { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px;
    background-position: center; background-size: cover; background-repeat: no-repeat;
  }
  /* アバター画像。WebAssets の avatar-*.png を同名で差し替えれば本番画像になる。 */
  .msg.assistant .avatar { background-color: #34c759; background-image: url("avatar-assistant.png"); }
  .msg.user .avatar { background-color: #0a84ff; background-image: url("avatar-user.png"); }

  .main { position: relative; display: flex; flex-direction: column; gap: 4px; max-width: min(720px, 78vw); min-width: 0; }
  /* AI側: row(アバター+吹き出し) と統計チップ・コピーを束ねる器。幅は吹き出し幅にフィット。
     チップを row の外に置くことで、アバターは吹き出し下端に固定されたまま（チップに引っ張られない）。 */
  .cluster { position: relative; display: flex; flex-direction: column; gap: 4px; width: fit-content; max-width: 100%; min-width: 0; }
  .msg.user .main { align-items: flex-end; }
  .label { font-size: 10px; font-weight: 700; color: #8e8e93; }
  /* 話者名に併記するモデル名は、細字＋やや薄めにしてメリハリを付ける。 */
  .label .model { font-weight: 400; opacity: 0.72; }
  /* 統計・ソースは行の外。アバター幅(32)+間隔(10)分インデントして吹き出し左端に揃える。 */
  .extras { padding-left: 42px; }

  /* ===== メッセージ操作ボタン（コピー等） ===== */
  /* .main 内に置き、user は align-items:flex-end で右寄せになる。普段は隠してホバーで表示。 */
  /* position:absolute で .main に対して浮かせる。レイアウトの流れから外れるので、
     ホバーで出ても下のメッセージや統計チップ・アバターを一切ずらさない。
     AI(assistant)は吹き出し左下（チップは右寄せ）、ユーザーは吹き出し右下に表示。 */
  .actions { position: absolute; display: none; gap: 2px; }
  /* AI: cluster 基準で吹き出し左下（left:42px = アバター32+間隔10、吹き出し左端の位置）。 */
  .msg.assistant .actions { left: 42px; bottom: 0; }
  /* ユーザー: main 基準で吹き出し右下。 */
  .msg.user .actions { right: 0; top: 100%; }
  .msg:hover .actions { display: flex; }
  .act-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border: none; background: transparent;
    cursor: pointer; color: #8e8e93; border-radius: 6px;
  }
  .act-btn:hover { background: rgba(127,127,127,0.18); color: inherit; }
  .act-btn.copied { color: #34c759; }

  .bubble {
    /* 中身の幅に合わせる（ラベル幅へ引き伸ばされない）。長文は最大幅で折り返す。ユーザー・アシスタント共通。 */
    width: max-content; max-width: min(720px, 78vw);
    padding: 10px 14px; border-radius: 16px;
    background: rgba(127,127,127,0.15);
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.user .bubble { background: linear-gradient(135deg, #0a84ff, #0060df); color: #fff; }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }

  /* ===== Markdown 要素 ===== */
  p { margin: 0 0 0.5em; }
  pre { background: rgba(0,0,0,0.18); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
  :not(pre) > code { background: rgba(127,127,127,0.2); padding: 1px 4px; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  ul, ol { margin: 0.3em 0; padding-left: 1.4em; }
  li { margin: 2px 0; }
  a { color: #0a84ff; text-decoration: none; }
  .msg.user a { color: #fff; text-decoration: underline; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; margin: 0.4em 0; }
  th, td { border: 1px solid rgba(127,127,127,0.4); padding: 3px 8px; }
  blockquote { margin: 0.3em 0; padding-left: 10px; border-left: 3px solid rgba(127,127,127,0.4); }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.3); margin: 0.6em 0; }
  img { max-width: 100%; }
  .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }

  /* ===== ローディングドット ===== */
  .dots { display: flex; gap: 4px; padding: 3px 0; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: #0a84ff; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ===== 統計チップ ===== */
  .stats { display: flex; gap: 4px; margin-top: 2px; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font-size: 8px; font-family: ui-monospace, Menlo, monospace; color: #8e8e93;
    background: rgba(127,127,127,0.12); padding: 3px 6px; border-radius: 6px; white-space: nowrap;
  }

  /* ===== 思考プロセス（折りたたみ） ===== */
  .thinking { margin: 0 0 6px; border-left: 2px solid rgba(127,127,127,0.35); padding-left: 8px; }
  .thinking > summary {
    cursor: pointer; font-size: 11px; font-weight: 600; color: #8e8e93;
    list-style: none; user-select: none;
  }
  .thinking > summary::-webkit-details-marker { display: none; }
  .thinking > summary::before { content: "▶ "; font-size: 9px; }
  .thinking[open] > summary::before { content: "▼ "; }
  .think-body {
    white-space: pre-wrap; word-break: break-word; font-size: 11.5px; line-height: 1.5;
    color: #8e8e93; margin-top: 4px; max-height: 260px; overflow-y: auto;
  }

  /* ===== 検索ソース ===== */
  .sources { display: flex; flex-direction: column; gap: 3px; margin-top: 3px; }
  .sources-h { font-size: 8px; font-weight: 700; color: #8e8e93; }
  .source {
    display: flex; gap: 6px; align-items: center; font-size: 8px;
    background: rgba(10,132,255,0.06); padding: 3px 8px; border-radius: 6px; color: inherit;
  }
  .src-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-host { color: #8e8e93; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; }

  /* ===== システムメッセージ ===== */
  .system { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 4px 24px; }
  .system .line { flex: 1; height: 0.5px; background: rgba(127,127,127,0.3); }
  .system .txt { font-size: 10px; color: #8e8e93; white-space: nowrap; }
</style>
</head>
<body>
<div id="conversation"></div>
<script>
// ===== 共通ユーティリティ =====
function decodeB64(b64) { return decodeURIComponent(escape(atob(b64))); }
function encodeB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return escapeHTML(s).replace(/"/g, "&quot;"); }

// Markdown より先に数式を退避し、marked による誤変換（$H_1$ の _ が斜体化する等）を防ぐ。
function protectMath(md) {
  var store = [];
  function ph(raw) { store.push(raw); return "@@M" + (store.length - 1) + "@@"; }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, function (m) { return ph(m); });
  md = md.replace(/\\\[([\s\S]+?)\\\]/g, function (m) { return ph(m); });
  md = md.replace(/\\\(([\s\S]+?)\\\)/g, function (m) { return ph(m); });
  md = md.replace(/(?<![\\$])\$([^$\n]+?)(?<![\\\s])\$(?!\d)/g, function (m, inner) {
    var t = inner.trim();
    if (/^\d/.test(t) && /\s/.test(inner) && inner.indexOf("\\") < 0) return m;
    return ph("\\(" + inner + "\\)");
  });
  return { md: md, store: store };
}

// marked が CJK 約物隣接の **太字** を処理できず残った "**...**" を <strong> 化する。
function applyCJKBold(root) {
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var targets = [], node;
  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.closest("code, pre, .katex")) continue;
    if (/\*\*[^*\n]+?\*\*/.test(node.nodeValue)) targets.push(node);
  }
  targets.forEach(function (tn) {
    var frag = document.createDocumentFragment();
    tn.nodeValue.split(/(\*\*[^*\n]+?\*\*)/g).forEach(function (part) {
      var m = part.match(/^\*\*([^*\n]+?)\*\*$/);
      if (m) { var st = document.createElement("strong"); st.textContent = m[1]; frag.appendChild(st); }
      else if (part) frag.appendChild(document.createTextNode(part));
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}

// 1つの本文(Markdown文字列)を要素に描画する。
function fillContent(el, mdText) {
  var p = protectMath(mdText || "");
  var html = marked.parse(p.md, { gfm: true, breaks: true });
  html = html.replace(/@@M(\d+)@@/g, function (_, i) { return escapeHTML(p.store[+i]); });
  el.innerHTML = html;
  // 太字補完は KaTeX より先に行う。KaTeXが先だと数式が入った **...** が
  // テキストノードを分割してしまい、太字を補完できなくなるため。
  if (html.indexOf("**") >= 0) applyCJKBold(el);
  if (p.store.length) {
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false,
        // 描画失敗時は赤ではなく地味なグレーでソースを表示する（目立たせない）。
        errorColor: "#888888"
      });
    } catch (e) {}
  }
}

// ===== 吹き出しHTML生成 =====
var state = { dark: false, generating: false, speaker: "AI", model: "" };

// AIの話者ラベル。モデル名があれば "話者 (モデル)" の形で、モデル部は細字spanにする。
function speakerLabelHTML() {
  var name = escapeHTML(state.speaker || "AI");
  if (!state.model) return name;
  return name + ' <span class="model">(' + escapeHTML(state.model) + ')</span>';
}

var ICON_COPY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICON_CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

// 吹き出し下の操作ボタン群。生テキスト(Markdown)は data-md に base64 で持たせる。
function actionsHTML(m) {
  if (!m.content) return "";
  return '<div class="actions">' +
    '<button class="act-btn" type="button" title="コピー" onclick="copyMessage(this)" data-md="' +
    encodeB64(m.content) + '">' + ICON_COPY + '</button>' +
    '</div>';
}

// コピーボタン押下 → Swift(NSPasteboard)へ生テキストを渡し、一時的に✓表示。
function copyMessage(btn) {
  try {
    var text = decodeB64(btn.getAttribute("data-md"));
    window.webkit.messageHandlers.copyToClipboard.postMessage(text);
  } catch (e) {}
  btn.classList.add("copied");
  btn.innerHTML = ICON_CHECK;
  setTimeout(function () { btn.classList.remove("copied"); btn.innerHTML = ICON_COPY; }, 1200);
}

function statsHTML(s) {
  if (!s) return "";
  function chip(icon, txt, tip) { return '<span class="chip" title="' + escapeAttr(tip) + '">' + icon + " " + escapeHTML(txt) + '</span>'; }
  var tps = (s.tokensPerSecond != null) ? s.tokensPerSecond.toFixed(1) : "0.0";
  var ttft = (s.ttft != null) ? s.ttft.toFixed(1) : "0.0";
  return '<div class="stats">' +
    chip("⚡", tps + " t/s", "トークン生成速度") +
    chip("🏷", s.completionTokens + " tokens", "生成トークン数") +
    chip("⏱", ttft + " s", "最初のトークンまでの時間") +
    '</div>';
}

// 思考プロセス（折りたたみ）。生成中の末尾メッセージのときは開いた状態で表示する。
function thinkingHTML(m, isLast) {
  if (!m.thinking) return "";
  var openAttr = (isLast && state.generating) ? " open" : "";
  return '<details class="thinking"' + openAttr + '>' +
    '<summary>思考プロセス</summary>' +
    '<div class="think-body">' + escapeHTML(m.thinking) + '</div>' +
  '</details>';
}

function sourcesHTML(sources) {
  if (!sources || !sources.length) return "";
  var items = sources.map(function (src) {
    var host = "";
    try { host = new URL(src.url).host; } catch (e) {}
    return '<a class="source" href="' + escapeAttr(src.url) + '">' +
      '<span class="src-title">' + escapeHTML(src.title) + '</span>' +
      '<span class="src-host">' + escapeHTML(host) + '</span></a>';
  }).join("");
  return '<div class="sources"><div class="sources-h">🌐 Web検索 ' + sources.length + '件</div>' + items + '</div>';
}

// 1メッセージ分のラッパーHTML（.content は後で fillContent で埋める）。
function bubbleHTML(m, idx, isLast) {
  if (m.role === "system") {
    return '<div class="system" data-i="' + idx + '">' +
      '<div class="line"></div><div class="txt">' + escapeHTML(m.content) + '</div><div class="line"></div></div>';
  }
  var isUser = m.role === "user";
  var label = isUser ? "あなた" : speakerLabelHTML();
  // 本文も思考もまだ無いときだけローディングドットを出す（思考が来たら思考を見せる）。
  var loading = (!isUser && isLast && state.generating && !m.content && !m.thinking);
  // 生成中の末尾メッセージ（ストリーミング中）はコピーボタンを出さない。確定後に表示する。
  var streaming = (!isUser && isLast && state.generating);
  var inner = loading
    ? '<div class="dots"><span></span><span></span><span></span></div>'
    : '<div class="content"></div>';
  var actions = (loading || streaming) ? '' : actionsHTML(m);

  if (isUser) {
    // ユーザー: 統計なし。コピーは main 基準で吹き出し右下に絶対配置（従来通り）。
    return '<div class="msg user" data-i="' + idx + '">' +
      '<div class="row">' +
        '<div class="avatar"></div>' +
        '<div class="main"><div class="label">' + label + '</div>' +
        '<div class="bubble">' + inner + '</div>' + actions + '</div>' +
      '</div>' +
    '</div>';
  }

  // AI: 統計チップ(右寄せ)とコピー(左下)を cluster でまとめる。統計を row の外に置くことで、
  // アバターが統計に引っ張られず吹き出し下端に固定される。検索ソースは従来通り行の外（左寄せ）。
  var statsBlock = (m.content && m.stats) ? statsHTML(m.stats) : "";
  var srcs = sourcesHTML(m.searchSources);
  var extras = srcs ? '<div class="extras">' + srcs + '</div>' : "";
  var thinkBlock = thinkingHTML(m, isLast);
  return '<div class="msg assistant" data-i="' + idx + '">' +
    '<div class="cluster">' +
      '<div class="row">' +
        '<div class="avatar"></div>' +
        '<div class="main"><div class="label">' + label + '</div>' +
        '<div class="bubble">' + thinkBlock + inner + '</div></div>' +
      '</div>' + statsBlock + actions +
    '</div>' + extras +
    '</div>';
}

// 末尾メッセージのDOMノードに本文を流し込む（ローディング中は何もしない）。
function fillNode(node, m) {
  if (!node || m.role === "system") return;
  var el = node.querySelector(".content");
  if (el) fillContent(el, m.content);
}

// ===== 公開API（Swift から呼ぶ） =====
function setMessages(msgsB64, dark, generating, speakerB64, modelB64) {
  state.dark = dark;
  state.generating = generating;
  state.speaker = speakerB64 ? decodeB64(speakerB64) : "AI";
  state.model = modelB64 ? decodeB64(modelB64) : "";
  document.body.className = dark ? "dark" : "light";
  var msgs = JSON.parse(decodeB64(msgsB64));
  var conv = document.getElementById("conversation");
  conv.innerHTML = msgs.map(function (m, i) { return bubbleHTML(m, i, i === msgs.length - 1); }).join("");
  msgs.forEach(function (m, i) {
    fillNode(conv.querySelector('[data-i="' + i + '"]'), m);
  });
  scrollToBottom(true);
}

function updateLast(msgB64, idx, generating) {
  state.generating = generating;
  var m = JSON.parse(decodeB64(msgB64));
  var conv = document.getElementById("conversation");
  var old = conv.querySelector('[data-i="' + idx + '"]');
  var tmp = document.createElement("div");
  tmp.innerHTML = bubbleHTML(m, idx, true);
  var fresh = tmp.firstElementChild;
  if (old) { old.replaceWith(fresh); } else { conv.appendChild(fresh); }
  fillNode(fresh, m);
  scrollToBottom(false);
}

// ===== 自動スクロール（WebView内部スクロールをJSで制御） =====
var autoFollow = true;
function nearBottom() {
  return (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 60);
}
function scrollToBottom(force) {
  if (force) autoFollow = true;
  if (force || autoFollow) {
    window.scrollTo(0, document.documentElement.scrollHeight);
  }
}
// ユーザーが自分で上にスクロールしたら追従を止め、下端付近に戻れば再開する。
window.addEventListener("scroll", function () { autoFollow = nearBottom(); }, { passive: true });
</script>
</body>
</html>
