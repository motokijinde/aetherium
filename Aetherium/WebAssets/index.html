<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script src="marked.min.js"></script>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 13px;
    line-height: 1.55;
    color: #1d1d1f;
    -webkit-text-size-adjust: 100%;
  }
  body.dark { color: #f5f5f7; }

  #conversation { padding: 10px 16px 14px; }

  /* ===== 吹き出しレイアウト ===== */
  .msg { display: flex; flex-direction: column; padding: 8px 0; }
  .msg.assistant { align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  /* アバター＋本文の行。アバターは吹き出しの下端に揃える（統計・ソースには引っ張られない）。 */
  .row { display: flex; align-items: flex-end; gap: 10px; max-width: 100%; }
  .msg.user .row { flex-direction: row-reverse; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex: 0 0 32px;
    background-position: center; background-size: cover; background-repeat: no-repeat;
  }
  /* アバター画像。WebAssets の avatar-*.png を同名で差し替えれば本番画像になる。 */
  .msg.assistant .avatar { background-color: #34c759; background-image: url("avatar-assistant.png"); }
  .msg.user .avatar { background-color: #0a84ff; background-image: url("avatar-user.png"); }

  .main { position: relative; display: flex; flex-direction: column; gap: 4px; max-width: min(720px, 78vw); min-width: 0; }
  /* AI側: row(アバター+吹き出し) と操作ボタン・統計チップを束ねる器。幅は吹き出し幅にフィット。
     ボタン・チップを row の外に置くことで、アバターは吹き出し下端に固定されたまま（引っ張られない）。 */
  .cluster { position: relative; display: flex; flex-direction: column; gap: 4px; width: fit-content; max-width: 100%; min-width: 0; }
  .msg.user .main { align-items: flex-end; }
  .label { font-size: 10px; font-weight: 700; color: #8e8e93; }
  /* 名前の横の発言時刻（X月X日 HH:MM）。細字・やや薄め。 */
  .label .time { font-weight: 400; opacity: 0.75; margin-left: 6px; }
  /* 話者名に併記するモデル名は、細字＋やや薄めにしてメリハリを付ける。 */
  .label .model { font-weight: 400; opacity: 0.72; }

  /* ===== メッセージ操作ボタン（コピー等） ===== */
  /* 普段は隠してホバーで表示。AI は吹き出し直下の行に左寄せで置き、その下に統計チップ行が続く。
     visibility:hidden で隠すので場所は常に確保され、ホバーで出ても他のメッセージはずれない。 */
  .actions { display: flex; gap: 2px; visibility: hidden; }
  .msg:hover .actions { visibility: visible; }
  /* AI: 吹き出し左端（アバター32+間隔10=42px）に左揃え。 */
  .msg.assistant .actions { padding-left: 42px; }
  /* ユーザー: main 基準で吹き出し右下に絶対配置（統計が無いので重ならない）。 */
  .msg.user .actions { position: absolute; right: 0; top: 100%; }
  .act-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border: none; background: transparent;
    cursor: pointer; color: #8e8e93; border-radius: 6px;
  }
  .act-btn:hover { background: rgba(127,127,127,0.18); color: inherit; }
  .act-btn.copied { color: #34c759; }
  /* 再思考の版ナビ（‹ 2 / 3 ›）。 */
  .ver-nav { display: inline-flex; align-items: center; }
  .ver-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 24px; padding: 0; border: none; background: transparent;
    cursor: pointer; color: #8e8e93; border-radius: 6px; font-size: 15px; line-height: 1;
  }
  .ver-btn:hover { background: rgba(127,127,127,0.18); color: inherit; }
  .ver-idx { font-size: 11px; color: #8e8e93; min-width: 28px; text-align: center; user-select: none; }

  .bubble {
    /* 中身の幅に合わせる（ラベル幅へ引き伸ばされない）。長文は最大幅で折り返す。ユーザー・アシスタント共通。 */
    width: max-content; max-width: min(720px, 78vw);
    padding: 10px 14px; border-radius: 16px;
    background: rgba(127,127,127,0.15);
    overflow-wrap: anywhere; word-break: break-word;
  }
  .msg.user .bubble { background: linear-gradient(135deg, #0a84ff, #0060df); color: #fff; }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }

  /* ===== Markdown 要素 ===== */
  p { margin: 0 0 0.5em; }
  pre { background: rgba(0,0,0,0.18); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
  /* コードブロックをヘッダー付きカードにする（ファイル名/言語＋コピー/保存/折りたたみ）。
     吹き出し内に収めるため、統計のズレ要因だった「吹き出し外チップ」は廃止した。 */
  .codecard { margin: 0.4em 0; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.18); }
  .codecard-head {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 6px 4px 10px; background: rgba(127,127,127,0.14);
  }
  .cc-name {
    flex: 1; min-width: 0; font-size: 11px; color: #8e8e93;
    font-family: ui-monospace, Menlo, monospace;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cc-btns { display: flex; gap: 2px; flex: 0 0 auto; }
  .cc-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; padding: 0; border: none; background: transparent;
    cursor: pointer; color: #8e8e93; border-radius: 6px;
  }
  .cc-btn:hover { background: rgba(127,127,127,0.25); color: inherit; }
  .cc-btn.copied { color: #34c759; }
  .cc-toggle-icon { display: inline-block; transition: transform 0.15s; }
  .codecard.collapsed .cc-toggle-icon { transform: rotate(-90deg); }
  .codecard.collapsed .codecard-body { display: none; }
  /* カード内の pre は背景・角丸・外余白をカードへ移譲（二重背景を消す。内側paddingは残す）。 */
  .codecard-body pre { margin: 0; border-radius: 0; background: transparent; }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 0.9em; }
  :not(pre) > code { background: rgba(127,127,127,0.2); padding: 1px 4px; border-radius: 4px; }
  pre code { background: none; padding: 0; }
  ul, ol { margin: 0.3em 0; padding-left: 1.4em; }
  li { margin: 2px 0; }
  a { color: #0a84ff; text-decoration: none; }
  .msg.user a { color: #fff; text-decoration: underline; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; margin: 0.4em 0; }
  th, td { border: 1px solid rgba(127,127,127,0.4); padding: 3px 8px; }
  blockquote { margin: 0.3em 0; padding-left: 10px; border-left: 3px solid rgba(127,127,127,0.4); }
  hr { border: none; border-top: 1px solid rgba(127,127,127,0.3); margin: 0.6em 0; }
  img { max-width: 100%; }
  .katex-display { margin: 0.4em 0; overflow-x: auto; overflow-y: hidden; }

  /* ===== 添付（画像サムネ・ファイルチップ） ===== */
  .atts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .att-img { max-width: 180px; max-height: 180px; border-radius: 10px; display: block; }
  .att-file {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
    background: rgba(255,255,255,0.22); padding: 4px 9px; border-radius: 8px; max-width: 220px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== ローディングドット ===== */
  .dots { display: flex; gap: 4px; padding: 3px 0; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: #0a84ff; animation: blink 1.2s infinite; }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ===== 統計チップ ===== */
  /* 操作ボタン行の下に、同じく吹き出し左端（42px）から左寄せで並べる。 */
  .stats { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-start; padding-left: 42px; }
  .chip {
    font-size: 8px; font-family: ui-monospace, Menlo, monospace; color: #8e8e93;
    background: rgba(127,127,127,0.12); padding: 3px 6px; border-radius: 6px; white-space: nowrap;
  }

  /* ===== 思考プロセス（折りたたみ） ===== */
  .thinking { margin: 0 0 6px; border-left: 2px solid rgba(127,127,127,0.35); padding-left: 8px; }
  .thinking > summary {
    cursor: pointer; font-size: 11px; font-weight: 600; color: #8e8e93;
    list-style: none; user-select: none;
  }
  .thinking > summary::-webkit-details-marker { display: none; }
  .thinking > summary::before { content: "▶ "; font-size: 9px; }
  .thinking[open] > summary::before { content: "▼ "; }
  .think-body {
    white-space: pre-wrap; word-break: break-word; font-size: 11.5px; line-height: 1.5;
    color: #8e8e93; margin-top: 4px; max-height: 260px; overflow-y: auto;
  }
  /* macOS の自動消滅オーバーレイだとノード再生成で消えすぎるため、
     思考枠は常時表示のカスタムスクロールバーにする。 */
  .think-body::-webkit-scrollbar { width: 8px; }
  .think-body::-webkit-scrollbar-track { background: transparent; }
  .think-body::-webkit-scrollbar-thumb {
    background: rgba(127,127,127,0.45); border-radius: 4px;
  }
  .think-body::-webkit-scrollbar-thumb:hover { background: rgba(127,127,127,0.65); }

  /* ===== 検索ソース（折りたたみ。思考プロセスと同じ開閉UI） ===== */
  .sources { margin: 6px 0 0; }
  .sources > summary {
    cursor: pointer; font-size: 11px; font-weight: 600; color: #8e8e93;
    list-style: none; user-select: none;
  }
  .sources > summary::-webkit-details-marker { display: none; }
  .sources > summary::before { content: "▶ "; font-size: 9px; }
  .sources[open] > summary::before { content: "▼ "; }
  .sources-list { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }
  /* 各ソースは下線なしのボタン風。通常は薄く、ホバーで文字が濃くなり押せる感を出す。 */
  .source {
    display: flex; gap: 8px; align-items: baseline; font-size: 11px;
    background: rgba(127,127,127,0.1); padding: 5px 9px; border-radius: 8px;
    color: #8e8e93; text-decoration: none; transition: color 0.12s, background 0.12s;
  }
  .source:hover { background: rgba(127,127,127,0.18); color: inherit; text-decoration: none; }
  .src-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .src-host { color: #8e8e93; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; font-size: 10px; }

  /* ===== システムメッセージ ===== */
  .system { display: flex; align-items: center; gap: 8px; justify-content: center; padding: 4px 24px; }
  .system .line { flex: 1; height: 0.5px; background: rgba(127,127,127,0.3); }
  .system .txt { font-size: 10px; color: #8e8e93; white-space: nowrap; }
</style>
</head>
<body>
<div id="conversation"></div>
<script>
// ===== 共通ユーティリティ =====
function decodeB64(b64) { return decodeURIComponent(escape(atob(b64))); }
function encodeB64(s) { return btoa(unescape(encodeURIComponent(s))); }
function escapeHTML(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function escapeAttr(s) { return escapeHTML(s).replace(/"/g, "&quot;"); }

// Markdown より先に数式を退避し、marked による誤変換（$H_1$ の _ が斜体化する等）を防ぐ。
function protectMath(md) {
  var store = [];
  function ph(raw) { store.push(raw); return "@@M" + (store.length - 1) + "@@"; }
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, function (m) { return ph(m); });
  md = md.replace(/\\\[([\s\S]+?)\\\]/g, function (m) { return ph(m); });
  md = md.replace(/\\\(([\s\S]+?)\\\)/g, function (m) { return ph(m); });
  md = md.replace(/(?<![\\$])\$([^$\n]+?)(?<![\\\s])\$(?!\d)/g, function (m, inner) {
    var t = inner.trim();
    if (/^\d/.test(t) && /\s/.test(inner) && inner.indexOf("\\") < 0) return m;
    return ph("\\(" + inner + "\\)");
  });
  return { md: md, store: store };
}

// marked が CJK 約物隣接の **太字** を処理できず残った "**...**" を <strong> 化する。
function applyCJKBold(root) {
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  var targets = [], node;
  while ((node = walker.nextNode())) {
    if (node.parentElement && node.parentElement.closest("code, pre, .katex")) continue;
    if (/\*\*[^*\n]+?\*\*/.test(node.nodeValue)) targets.push(node);
  }
  targets.forEach(function (tn) {
    var frag = document.createDocumentFragment();
    tn.nodeValue.split(/(\*\*[^*\n]+?\*\*)/g).forEach(function (part) {
      var m = part.match(/^\*\*([^*\n]+?)\*\*$/);
      if (m) { var st = document.createElement("strong"); st.textContent = m[1]; frag.appendChild(st); }
      else if (part) frag.appendChild(document.createTextNode(part));
    });
    tn.parentNode.replaceChild(frag, tn);
  });
}

// 1つの本文(Markdown文字列)を要素に描画する。
function fillContent(el, mdText) {
  var p = protectMath(mdText || "");
  var html = marked.parse(p.md, { gfm: true, breaks: true });
  html = html.replace(/@@M(\d+)@@/g, function (_, i) { return escapeHTML(p.store[+i]); });
  el.innerHTML = html;
  // 太字補完は KaTeX より先に行う。KaTeXが先だと数式が入った **...** が
  // テキストノードを分割してしまい、太字を補完できなくなるため。
  if (html.indexOf("**") >= 0) applyCJKBold(el);
  if (p.store.length) {
    try {
      renderMathInElement(el, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false }
        ],
        throwOnError: false,
        // 描画失敗時は赤ではなく地味なグレーでソースを表示する（目立たせない）。
        errorColor: "#888888"
      });
    } catch (e) {}
  }
}

// ===== 吹き出しHTML生成 =====
var state = { dark: false, generating: false, speaker: "AI", model: "", userName: "あなた" };

// 発言時刻を "X月X日 HH:MM" に整形する（epochミリ秒を受け取る）。
function formatTime(ms) {
  if (!ms) return "";
  var d = new Date(ms);
  if (isNaN(d.getTime())) return "";
  var time = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + time;
}

// AIの話者ラベル。モデル名があれば "話者 (モデル)" の形で、モデル部は細字spanにする。
function speakerLabelHTML() {
  var name = escapeHTML(state.speaker || "AI");
  if (!state.model) return name;
  return name + ' <span class="model">(' + escapeHTML(state.model) + ')</span>';
}

var ICON_COPY = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
var ICON_CHECK = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
var ICON_DOWNLOAD = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
var ICON_CHEVRON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
var ICON_REGEN = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>';

// Swift(NSSavePanel)へ {filename, content} を渡して保存する。
function saveFile(filename, content) {
  try { window.webkit.messageHandlers.saveFile.postMessage({ filename: filename, content: content }); }
  catch (e) {}
}

// パス成分を捨てて basename のみにする（パストラバーサル防止。Swift側でも再度防御する）。
function sanitizeName(name) {
  name = (name || "").split("/").pop().split("\\").pop();
  return name || "file.txt";
}

// コードフェンスの info（language-xxx から復元）から「明示されたファイル名」を取り出す。
// "lang:name" → name ／ 単一でも "." を含めばファイル名 ／ 言語名だけ・空 → null（ファイルではない）。
function explicitFilename(info) {
  info = (info || "").trim();
  if (!info) return null;
  var parts = info.split(":");
  if (parts.length >= 2 && parts.slice(1).join(":").trim()) return sanitizeName(parts.slice(1).join(":").trim());
  if (info.indexOf(".") >= 0) return sanitizeName(info);
  return null;
}

// 言語名 → 拡張子（ファイル名が明示されていないコードの保存名フォールバック用）。
var LANG_EXT = {
  python:"py", py:"py", javascript:"js", js:"js", typescript:"ts", ts:"ts",
  swift:"swift", json:"json", markdown:"md", md:"md", html:"html", css:"css",
  shell:"sh", bash:"sh", sh:"sh", csv:"csv", xml:"xml", yaml:"yaml", yml:"yml",
  text:"txt", txt:"txt", c:"c", cpp:"cpp", "c++":"cpp", java:"java", go:"go",
  ruby:"rb", rb:"rb", php:"php", sql:"sql"
};

// info の先頭トークンを言語名として返す（"name.ext" のようにファイル名のみなら ""）。
function langOnly(info) {
  info = (info || "").trim();
  if (!info) return "";
  var parts = info.split(":");
  var head = parts[0].trim();
  if (parts.length < 2 && head.indexOf(".") >= 0) return "";
  return head;
}

// カードのヘッダーボタンを作る共通ヘルパ。
function makeCardButton(title, inner) {
  var b = document.createElement("button");
  b.className = "cc-btn"; b.type = "button"; b.title = title; b.innerHTML = inner;
  return b;
}

// 描画済みコードブロックを、ヘッダー付きカード（ファイル名/言語＋コピー/保存/折りたたみ）にする。
// ファイル名が無くてもカード化し、言語名表示＋snippet.<ext> で保存できる（AI側の指示精度に依存しない）。
function decorateCodeBlocks(root) {
  var pres = root.querySelectorAll("pre");
  for (var i = 0; i < pres.length; i++) {
    var pre = pres[i];
    if (pre.parentNode && pre.parentNode.className === "codecard-body") continue; // 二重カード化防止
    var code = pre.querySelector("code");
    if (!code) continue;
    var text = code.textContent || "";
    if (!text.trim()) continue;
    var info = "";
    (code.className || "").split(/\s+/).forEach(function (cls) {
      if (cls.indexOf("language-") === 0) info = cls.slice(9); // "language-".length
    });
    var fname = explicitFilename(info);
    var lang = langOnly(info);
    var displayName = fname || lang || "テキスト";
    var dlName = fname || ("snippet." + (LANG_EXT[lang.toLowerCase()] || "txt"));

    var card = document.createElement("div");
    card.className = "codecard";
    var head = document.createElement("div");
    head.className = "codecard-head";
    head.innerHTML = '<span class="cc-name">📄 ' + escapeHTML(displayName) + '</span>';
    var btns = document.createElement("div");
    btns.className = "cc-btns";

    var copyBtn = makeCardButton("コピー", ICON_COPY);
    (function (tx, b) {
      b.addEventListener("click", function () {
        try { window.webkit.messageHandlers.copyToClipboard.postMessage(tx); } catch (e) {}
        b.classList.add("copied"); b.innerHTML = ICON_CHECK;
        setTimeout(function () { b.classList.remove("copied"); b.innerHTML = ICON_COPY; }, 1200);
      });
    })(text, copyBtn);

    var dlBtn = makeCardButton("保存", ICON_DOWNLOAD);
    (function (nm, tx) {
      dlBtn.addEventListener("click", function () { saveFile(nm, tx); });
    })(dlName, text);

    var tgBtn = makeCardButton("折りたたみ", '<span class="cc-toggle-icon">' + ICON_CHEVRON + '</span>');
    (function (c) {
      tgBtn.addEventListener("click", function () { c.classList.toggle("collapsed"); });
    })(card);

    btns.appendChild(copyBtn);
    btns.appendChild(dlBtn);
    btns.appendChild(tgBtn);
    head.appendChild(btns);

    var body = document.createElement("div");
    body.className = "codecard-body";
    pre.parentNode.insertBefore(card, pre);
    card.appendChild(head);
    card.appendChild(body);
    body.appendChild(pre);
  }
}

// メッセージ操作の「Markdownで保存」ボタン → 本文(生Markdown)を message.md として保存。
function saveMessage(btn) {
  try { saveFile("message.md", decodeB64(btn.getAttribute("data-md"))); }
  catch (e) {}
}

// 添付（画像サムネ・ファイルチップ）。base64 はそのまま data URL に埋める。
function attachmentsHTML(m) {
  if (!m.attachments || !m.attachments.length) return "";
  var items = m.attachments.map(function (a) {
    if (a.kind === "image") {
      return '<img class="att-img" src="data:' + (a.mime || "image/jpeg") + ';base64,' + a.payload + '">';
    }
    return '<span class="att-file">📄 ' + escapeHTML(a.filename) + '</span>';
  }).join("");
  return '<div class="atts">' + items + '</div>';
}

// 吹き出し下の操作ボタン群。生テキスト(Markdown)は data-md に base64 で持たせる。
function actionsHTML(m, idx, isLast) {
  if (!m.content) return "";
  var md = encodeB64(m.content);
  var copyBtn = '<button class="act-btn" type="button" title="コピー" onclick="copyMessage(this)" data-md="' + md + '">' + ICON_COPY + '</button>';
  // 資料(Markdown文書)はAIメッセージ単位で .md 保存できる（コードはブロックごとに保存）。
  var saveBtn = (m.role === "assistant")
    ? '<button class="act-btn" type="button" title="Markdownで保存" onclick="saveMessage(this)" data-md="' + md + '">' + ICON_DOWNLOAD + '</button>'
    : '';
  // 再思考は最後のAI回答のみ。idx>0（前にユーザー発言がある）＝Swift側のガード条件に合わせ、
  // 定型あいさつ(idx 0)では機能しないため出さない。版ナビは複数版を持つメッセージに出す。
  var regenBtn = (m.role === "assistant" && isLast && idx > 0)
    ? '<button class="act-btn" type="button" title="再思考" onclick="regenerateMessage(this)" data-id="' + escapeAttr(m.id) + '">' + ICON_REGEN + '</button>'
    : '';
  var nav = (m.variantCount && m.variantCount > 1)
    ? '<span class="ver-nav">' +
        '<button class="ver-btn" type="button" title="前の回答" onclick="selectVariant(this,-1)" data-id="' + escapeAttr(m.id) + '">‹</button>' +
        '<span class="ver-idx">' + ((m.variantIndex || 0) + 1) + ' / ' + m.variantCount + '</span>' +
        '<button class="ver-btn" type="button" title="次の回答" onclick="selectVariant(this,1)" data-id="' + escapeAttr(m.id) + '">›</button>' +
      '</span>'
    : '';
  return '<div class="actions">' + copyBtn + saveBtn + regenBtn + nav + '</div>';
}

// 再思考(↻)ボタン押下 → SwiftへメッセージIDを渡す。
function regenerateMessage(btn) {
  try { window.webkit.messageHandlers.regenerate.postMessage(btn.getAttribute("data-id")); } catch (e) {}
}
// 版ナビ(‹ ›)押下 → Swiftへ {id, dir} を渡す（dir: -1=前 / +1=次）。
function selectVariant(btn, dir) {
  try { window.webkit.messageHandlers.selectVariant.postMessage({ id: btn.getAttribute("data-id"), dir: dir }); } catch (e) {}
}

// コピーボタン押下 → Swift(NSPasteboard)へ生テキストを渡し、一時的に✓表示。
function copyMessage(btn) {
  try {
    var text = decodeB64(btn.getAttribute("data-md"));
    window.webkit.messageHandlers.copyToClipboard.postMessage(text);
  } catch (e) {}
  btn.classList.add("copied");
  btn.innerHTML = ICON_CHECK;
  setTimeout(function () { btn.classList.remove("copied"); btn.innerHTML = ICON_COPY; }, 1200);
}

function statsHTML(s) {
  if (!s) return "";
  function chip(icon, txt, tip) { return '<span class="chip" title="' + escapeAttr(tip) + '">' + icon + " " + escapeHTML(txt) + '</span>'; }
  var tps = (s.tokensPerSecond != null) ? s.tokensPerSecond.toFixed(1) : "0.0";
  var ttft = (s.ttft != null) ? s.ttft.toFixed(1) : "0.0";
  return '<div class="stats">' +
    chip("⚡", tps + " t/s", "トークン生成速度") +
    chip("🏷", s.completionTokens + " tokens", "生成トークン数") +
    chip("⏱", ttft + " s", "最初のトークンまでの時間") +
    '</div>';
}

// 思考プロセス（折りたたみ）。生成中の末尾メッセージのときは開いた状態で表示する。
function thinkingHTML(m, isLast) {
  if (!m.thinking) return "";
  var openAttr = (isLast && state.generating) ? " open" : "";
  return '<details class="thinking"' + openAttr + '>' +
    '<summary>思考プロセス</summary>' +
    '<div class="think-body">' + escapeHTML(m.thinking) + '</div>' +
  '</details>';
}

function sourcesHTML(sources) {
  if (!sources || !sources.length) return "";
  var items = sources.map(function (src) {
    var host = "";
    try { host = new URL(src.url).host; } catch (e) {}
    return '<a class="source" href="' + escapeAttr(src.url) + '">' +
      '<span class="src-title">' + escapeHTML(src.title) + '</span>' +
      '<span class="src-host">' + escapeHTML(host) + '</span></a>';
  }).join("");
  return '<details class="sources">' +
    '<summary>Web検索 ' + sources.length + '件</summary>' +
    '<div class="sources-list">' + items + '</div>' +
  '</details>';
}

// 1メッセージ分のラッパーHTML（.content は後で fillContent で埋める）。
function bubbleHTML(m, idx, isLast) {
  if (m.role === "system") {
    return '<div class="system" data-i="' + idx + '">' +
      '<div class="line"></div><div class="txt">' + escapeHTML(m.content) + '</div><div class="line"></div></div>';
  }
  var isUser = m.role === "user";
  var label = isUser ? escapeHTML(state.userName || "あなた") : speakerLabelHTML();
  var timeStr = formatTime(m.date);
  if (timeStr) label += '<span class="time">' + timeStr + '</span>';
  // 本文も思考もまだ無いときだけローディングドットを出す（思考が来たら思考を見せる）。
  var loading = (!isUser && isLast && state.generating && !m.content && !m.thinking);
  // 生成中の末尾メッセージ（ストリーミング中）はコピーボタンを出さない。確定後に表示する。
  var streaming = (!isUser && isLast && state.generating);
  var inner = loading
    ? '<div class="dots"><span></span><span></span><span></span></div>'
    : '<div class="content"></div>';
  var actions = (loading || streaming) ? '' : actionsHTML(m, idx, isLast);

  if (isUser) {
    // ユーザー: 統計なし。コピーは main 基準で吹き出し右下に絶対配置（従来通り）。
    return '<div class="msg user" data-i="' + idx + '">' +
      '<div class="row">' +
        '<div class="avatar"></div>' +
        '<div class="main"><div class="label">' + label + '</div>' +
        '<div class="bubble">' + attachmentsHTML(m) + inner + '</div>' + actions + '</div>' +
      '</div>' +
    '</div>';
  }

  // AI: row(アバター+吹き出し) の下に、統計チップ行 → 操作ボタン行 の順で縦に並べる
  // （どちらも吹き出し左端に左寄せ）。これらを row の外に出すことでアバターが下端固定される。
  // 思考プロセスは本文の上、検索ソース（根拠）は本文の下に折りたたみで置く。
  // ボタンは visibility:hidden で場所を確保するので、ホバーで出ても他のメッセージはずれない。
  var statsBlock = (m.content && m.stats) ? statsHTML(m.stats) : (m.content ? '<div class="stats"></div>' : "");
  var srcs = sourcesHTML(m.searchSources);
  var thinkBlock = thinkingHTML(m, isLast);
  return '<div class="msg assistant" data-i="' + idx + '">' +
    '<div class="cluster">' +
      '<div class="row">' +
        '<div class="avatar"></div>' +
        '<div class="main"><div class="label">' + label + '</div>' +
        '<div class="bubble">' + thinkBlock + inner + srcs + '</div></div>' +
      '</div>' + statsBlock + actions +
    '</div>' +
    '</div>';
}

// 思考プロセス枠の下端追従フラグ。ユーザーが上にスクロールしたら止め、下端へ戻すと再開する。
var thinkFollow = true;

// 生成中、思考プロセス枠（内部スクロール）のスクロール位置を制御する。
// updateLast はトークン毎にノードを作り直すため、追従中は下端へ、そうでなければ
// 直前のスクロール位置（prevScroll）を復元して、ユーザーが読んでいる位置を保つ。
function applyThinkScroll(node, prevScroll) {
  if (!node) return;
  var tb = node.querySelector(".think-body");
  if (!tb) return;
  tb.scrollTop = thinkFollow ? tb.scrollHeight : prevScroll;
  // ユーザー操作で下端付近なら追従、離れたら停止（プログラム設定分も同じ判定で吸収）。
  tb.addEventListener("scroll", function () {
    thinkFollow = (tb.scrollTop + tb.clientHeight >= tb.scrollHeight - 8);
  });
}

// 末尾メッセージのDOMノードに本文を流し込む（ローディング中は何もしない）。
function fillNode(node, m, streaming) {
  if (!node || m.role === "system") return;
  var el = node.querySelector(".content");
  if (el) {
    fillContent(el, m.content);
    // 生成中(末尾ストリーミング)はカード化しない。確定後の再描画でコードブロックをカード化する。
    if (!streaming) decorateCodeBlocks(el);
  }
}

// ===== 公開API（Swift から呼ぶ） =====
function setMessages(msgsB64, dark, generating, speakerB64, modelB64, userB64) {
  if (generating && !state.generating) thinkFollow = true;  // 新しい生成の開始時は下端追従に戻す
  state.dark = dark;
  state.generating = generating;
  state.speaker = speakerB64 ? decodeB64(speakerB64) : "AI";
  state.model = modelB64 ? decodeB64(modelB64) : "";
  state.userName = userB64 ? decodeB64(userB64) : "あなた";
  document.body.className = dark ? "dark" : "light";
  var msgs = JSON.parse(decodeB64(msgsB64));
  var conv = document.getElementById("conversation");
  // innerHTML 全置換で消える前に、最後の思考枠のスクロール位置を控える。
  var prevTbs = conv.querySelectorAll(".think-body");
  var prevScroll = prevTbs.length ? prevTbs[prevTbs.length - 1].scrollTop : 0;
  conv.innerHTML = msgs.map(function (m, i) { return bubbleHTML(m, i, i === msgs.length - 1); }).join("");
  msgs.forEach(function (m, i) {
    var streaming = (m.role !== "user" && i === msgs.length - 1 && state.generating);
    var node = conv.querySelector('[data-i="' + i + '"]');
    fillNode(node, m, streaming);
    if (streaming) applyThinkScroll(node, prevScroll);
  });
  scrollToBottom(true);
}

function updateLast(msgB64, idx, generating) {
  if (generating && !state.generating) thinkFollow = true;  // 新しい生成の開始時は下端追従に戻す
  state.generating = generating;
  var m = JSON.parse(decodeB64(msgB64));
  var conv = document.getElementById("conversation");
  var old = conv.querySelector('[data-i="' + idx + '"]');
  // ノード再生成で内部スクロールが先頭へ戻るため、直前の思考枠の位置を控えておく。
  var oldTb = old ? old.querySelector(".think-body") : null;
  var prevScroll = oldTb ? oldTb.scrollTop : 0;
  var tmp = document.createElement("div");
  tmp.innerHTML = bubbleHTML(m, idx, true);
  var fresh = tmp.firstElementChild;
  if (old) { old.replaceWith(fresh); } else { conv.appendChild(fresh); }
  fillNode(fresh, m, generating);
  if (generating) applyThinkScroll(fresh, prevScroll);
  scrollToBottom(false);
}

// ===== 自動スクロール（WebView内部スクロールをJSで制御） =====
var autoFollow = true;
function nearBottom() {
  return (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 60);
}
function scrollToBottom(force) {
  if (force) autoFollow = true;
  if (force || autoFollow) {
    window.scrollTo(0, document.documentElement.scrollHeight);
  }
}
// ユーザーが自分で上にスクロールしたら追従を止め、下端付近に戻れば再開する。
window.addEventListener("scroll", function () { autoFollow = nearBottom(); }, { passive: true });
</script>
</body>
</html>
